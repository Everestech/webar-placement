<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Restaurado</title>
    
    <!-- Librerías base que funcionaron -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }

        /* Estilo del botón original que funcionaba */
        #example-start-button {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            padding: 15px 30px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* Forzado de video a pantalla completa sin márgenes */
        video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <button id="example-start-button">ACTIVAR CÁMARA</button>

    <!-- UI de carga de MindAR (el escáner) -->
    <div id="example-scanning-overlay" class="hidden">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; text-align: center;">
            <div style="border: 2px solid white; width: 200px; height: 200px; margin-bottom: 10px;"></div>
            <p>Enfoca el marcador</p>
        </div>
    </div>

    <!-- Escena configurada como en la versión que sí mostraba el 3D -->
    <a-scene 
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no; uiScanning: #example-scanning-overlay;" 
        embedded
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- Cámara vinculada a MindAR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- El target con el modelo que ya habías logrado ver -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                src="#avatarModel" 
                rotation="0 0 0" 
                position="0 0 0" 
                scale="0.005 0.005 0.005">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const startButton = document.querySelector("#example-start-button");
        const sceneEl = document.querySelector('a-scene');

        startButton.addEventListener('click', () => {
            // Iniciamos el sistema MindAR
            const arSystem = sceneEl.systems['mindar-image-system'];
            arSystem.start(); 
            
            // Ocultamos el botón
            startButton.classList.add('hidden');
            
            // Mostramos el overlay de escaneo
            document.querySelector("#example-scanning-overlay").classList.remove('hidden');
        });

        // Cuando se encuentra el marcador, ocultamos el cuadro de escaneo
        const targetEntity = document.querySelector('[mindar-image-target]');
        targetEntity.addEventListener("targetFound", () => {
            document.querySelector("#example-scanning-overlay").classList.add('hidden');
        });

        targetEntity.addEventListener("targetLost", () => {
            document.querySelector("#example-scanning-overlay").classList.remove('hidden');
        });
    </script>
</body>
</html>
