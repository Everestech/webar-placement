<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Full Screen - Fixed Model</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #overlay.hidden { display: none; }

        /* Forzado de video a pantalla completa sin deformar */
        video {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="text-center p-6">
            <h1 class="text-2xl font-bold mb-6">Escáner AR Listo</h1>
            <button id="start-button" class="bg-blue-600 text-white font-bold py-4 px-10 rounded-full shadow-xl">
                ACTIVAR CÁMARA
            </button>
        </div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiLoading: no;" 
        embedded
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Modelo original de ejemplo -->
            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- ILUMINACIÓN: Fundamental para ver modelos GLTF -->
        <a-light type="ambient" intensity="1.5"></a-light>
        <a-light type="directional" position="0 10 5" intensity="1"></a-light>

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

        <!-- El marcador -->
        <a-entity mindar-image-target="targetIndex: 0">
            
            <!-- MODELO GLTF: Ajustado para que sea visible (0.1 suele ser un buen inicio) -->
            <a-gltf-model 
                src="#avatarModel" 
                rotation="0 0 0" 
                position="0 0 0" 
                scale="0.1 0.1 0.1">
            </a-gltf-model>

            <!-- CUBO DE PRUEBA: Si ves esto pero no el modelo, el .gltf tiene problemas -->
            <a-box position="0.5 0 0" scale="0.2 0.2 0.2" color="red"></a-box>
            
        </a-entity>
    </a-scene>

    <script>
        const startButton = document.getElementById('start-button');
        const overlay = document.getElementById('overlay');
        const sceneEl = document.querySelector('a-scene');

        startButton.addEventListener('click', () => {
            overlay.classList.add('hidden');
            const arSystem = sceneEl.systems['mindar-image-system'];
            if (arSystem) {
                arSystem.start();
            }
        });

        // Eventos para depuración en consola
        const targetEntity = document.querySelector('[mindar-image-target]');
        targetEntity.addEventListener("targetFound", event => {
            console.log("Marcador encontrado");
        });
        targetEntity.addEventListener("targetLost", event => {
            console.log("Marcador perdido");
        });
    </script>
</body>
</html>
