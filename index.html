<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escaner AR con Three.js (Activación de Cámara)</title>
    
    <!-- Tailwind CSS CDN para el estilo de la interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- 1. Librerías CRÍTICAS: Three.js y MindAR Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-three.prod.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        /* Contenedor principal para la escena AR */
        #scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: none; /* Oculto hasta que se inicia el AR */
        }

        /* Estilos del elemento de video para control manual */
        #video-element {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none; /* Ocultamos el video, MindAR usa el canvas para el render */
        }

        /* Estilos de la capa de inicio */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background-color: rgba(17, 24, 39, 0.98); 
            padding: 1rem;
            transition: opacity 0.5s ease-out;
        }

        .instructions {
            background-color: #1f2937;
            color: #d1d5db;
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-top: 2rem;
            border: 1px solid #374151;
            max-width: 90%;
            text-align: center;
        }
        
        /* Mensaje de estado AR */
        #detection-status {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            display: none;
            backdrop-filter: blur(5px);
            background-color: rgba(0, 0, 0, 0.5);
            min-width: 200px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1. CAPA DE INICIO (Requiere gesto de usuario) -->
    <div id="start-overlay">
        <h1 class="text-4xl font-extrabold text-teal-400 mb-4 text-center">Escaner AR con MindAR</h1>
        
        <p id="status-message" class="text-lg text-gray-300 mb-8 text-center max-w-lg">
            Presiona el botón para solicitar acceso a la cámara.
        </p>

        <button id="startButton" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 text-xl rounded-full shadow-2xl transition duration-300 transform hover:scale-105 cursor-pointer ring-4 ring-indigo-400">
            Iniciar Cámara AR
        </button>

        <div class="instructions">
            <p class="font-semibold text-xl mb-3 text-yellow-400">Marcador de Ejemplo:</p>
            <img class="mt-4 rounded-lg shadow-md max-w-full h-auto mx-auto border-2 border-white" style="max-height: 150px;" 
                 src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" 
                 alt="Imagen del marcador Card-Example" />
            <p class="mt-3 text-sm italic text-gray-400">Apunta la cámara a esta imagen después de iniciar.</p>
        </div>
    </div>
    
    <!-- 2. Contenedor de estado de detección -->
    <div id="detection-status"></div>

    <!-- 3. CONTENEDOR DE LA ESCENA AR -->
    <div id="scene-container">
        <!-- Elemento de video que MindAR utilizará como fuente. Debe ser autoplay y playsinline -->
        <video id="video-element" autoplay playsinline></video>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const startOverlay = document.getElementById('start-overlay');
        const sceneContainer = document.getElementById('scene-container');
        const videoElement = document.getElementById('video-element');
        const statusDiv = document.getElementById('detection-status');
        const statusMessage = document.getElementById('status-message');

        let mindarThree;
        let renderer, scene, camera;
        let mesh; 

        // Función para manejar errores de la API de MediaDevices
        const handleError = (error) => {
            console.error('MindAR/Camera Error:', error);
            const message = error.name === 'NotAllowedError' ? 
                'Permiso de cámara denegado. Por favor, habilítalo en la configuración del navegador.' : 
                `Error crítico: ${error.message || error}. No se pudo iniciar la cámara.`;
            
            statusMessage.innerHTML = `
                <div class="bg-red-700 text-white p-4 rounded-lg shadow-xl text-center">
                    ⚠️ ${message}
                </div>
            `;
            startButton.style.display = 'none';
            statusDiv.style.display = 'none'; // Ocultar el estado flotante si falla
        };

        const setupThreeScene = (anchor) => {
            // Geometría y material del cubo
            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            // Material con color vibrante y animación básica
            const material = new THREE.MeshPhongMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.9 }); 
            mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.05, 0); // Levantado
            
            // Luz (esencial para MeshPhongMaterial)
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            
            // Añadir luz a la escena y el objeto al anclaje
            scene.add(light);
            anchor.group.add(mesh);

            // Agregar un texto simple sobre el cubo (opcional, pero añade feedback)
            const loader = new THREE.FontLoader();
            // Utilizar una fuente base disponible
            // Opcional: Para simplificar, usamos un plano con textura de texto o un BoxGeometry simple
            const infoPlaneGeometry = new THREE.PlaneGeometry(0.25, 0.1);
            const infoCanvas = document.createElement('canvas');
            infoCanvas.width = 512;
            infoCanvas.height = 256;
            const ctx = infoCanvas.getContext('2d');
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fillRect(0, 0, 512, 256);
            ctx.fillStyle = '#1e3a8a';
            ctx.font = 'Bold 80pt Inter';
            ctx.textAlign = 'center';
            ctx.fillText('¡AR OK!', 256, 170);
            
            const texture = new THREE.CanvasTexture(infoCanvas);
            const infoMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
            const infoPlane = new THREE.Mesh(infoPlaneGeometry, infoMaterial);
            infoPlane.position.set(0, 0.18, 0); // Encima del cubo
            anchor.group.add(infoPlane);
        };

        const initCamera = async () => {
            try {
                // 1. Ocultar la superposición
                startOverlay.style.opacity = '0';
                
                // 2. Mostrar estado de cámara
                statusDiv.textContent = 'Solicitando acceso a la cámara...';
                statusDiv.className = "bg-yellow-600/80";
                statusDiv.style.display = 'block';

                // 3. getUserMedia: Acceso a la cámara
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });

                // 4. Asignar el stream al elemento de video
                videoElement.srcObject = stream;

                // 5. Esperar que los metadatos del video estén cargados
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = resolve;
                });
                
                // 6. Iniciar la reproducción del video
                await videoElement.play();
                
                // 7. Retardo ligero para asegurar la estabilización del video (opcional pero útil)
                await new Promise(r => setTimeout(r, 100));

                console.log("Cámara iniciada y reproduciéndose correctamente.");
                statusDiv.textContent = 'Cámara lista. Inicializando MindAR...';
                
                // Proceder a iniciar MindAR
                await startMindAR();

            } catch (error) {
                handleError(error);
            }
        };

        const startMindAR = async () => {
             // 1. Inicializar MindAR Three.js, pasándole el elemento de video ya activo
            mindarThree = new MindARThree.MindARThree({
                container: sceneContainer,
                imageTargetSrc: 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind',
                video: videoElement, // CRÍTICO: Usar el video ya iniciado
                // Ajustes de rendimiento
                filterBeta: 0.00001,
                missTolerance: 10,
                maxTrack: 1
            });

            // 2. Obtener componentes de la escena
            renderer = mindarThree.renderer;
            scene = mindarThree.scene;
            camera = mindarThree.camera;

            // 3. Obtener el anclaje de detección (Target Index 0)
            const anchor = mindarThree.addAnchor(0);

            // 4. Configurar los objetos 3D y la luz en el anclaje
            setupThreeScene(anchor);
            
            // 5. Configurar eventos de detección para feedback
            anchor.onTargetFound = () => {
                statusDiv.textContent = '✅ ¡Marcador detectado!';
                statusDiv.className = "bg-green-600/80";
            };
            anchor.onTargetLost = () => {
                statusDiv.textContent = 'Marcador perdido. 🔍 Buscando...';
                statusDiv.className = "bg-yellow-600/80";
            };

            // 6. Iniciar el motor AR
            await mindarThree.start();
            console.log("MindAR Three.js iniciado correctamente.");
            
            // 7. Mostrar la escena y ocultar el overlay
            sceneContainer.style.display = 'block';
            setTimeout(() => { startOverlay.style.display = 'none'; }, 500);
            statusDiv.textContent = 'Buscando marcador...';
            statusDiv.className = "bg-yellow-600/80";
            
            // 8. Iniciar el loop de animación
            animate();
        }

        // Bucle de animación de Three.js
        const animate = () => {
            // Animación del cubo: rotación
            if (mesh) {
                mesh.rotation.y += 0.01;
                mesh.rotation.x += 0.005;
            }
            
            // Renderizado
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // Evento de inicio con el gesto del usuario
        startButton.addEventListener('click', initCamera);

        // Inicializar estado del div de detección
        document.addEventListener('DOMContentLoaded', () => {
             statusDiv.style.display = 'block';
             statusDiv.textContent = "Listo para iniciar. Click en el botón.";
             statusDiv.className = "bg-gray-600/80";
        });
    </script>
</body>
</html>
