<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escaner AR con Three.js Manual</title>
    
    <!-- Tailwind CSS CDN para el estilo de la interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- 1. Librerías CRÍTICAS: Three.js y MindAR Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-three.prod.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        /* Contenedor principal para la escena AR */
        #scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: none; /* Oculto hasta que se inicia el AR */
        }

        /* Estilos del video y el canvas, ocupando todo el contenedor */
        #video-element, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Ocultar el elemento de video, ya que MindAR proyecta la escena en el canvas */
        #video-element {
            display: none;
        }

        /* Estilos de la capa de inicio */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background-color: rgba(17, 24, 39, 0.98); 
            padding: 1rem;
        }

        .instructions {
            background-color: #1f2937;
            color: #d1d5db;
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-top: 2rem;
            border: 1px solid #374151;
            max-width: 90%;
            text-align: center;
        }
        
        /* Mensaje de estado AR */
        #detection-status {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            color: white;
            font-weight: bold;
            display: none;
            backdrop-filter: blur(5px);
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <!-- 1. CAPA DE INICIO (Requiere gesto de usuario) -->
    <div id="start-overlay">
        <h1 class="text-4xl font-extrabold text-teal-400 mb-4 text-center">Escaner AR con Three.js</h1>
        
        <p id="status-message" class="text-lg text-gray-300 mb-8 text-center max-w-lg">
            Presiona el botón para solicitar acceso a la cámara e iniciar el motor AR.
        </p>

        <button id="startButton" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 text-xl rounded-full shadow-2xl transition duration-300 transform hover:scale-105 cursor-pointer ring-4 ring-indigo-400">
            Iniciar Realidad Aumentada
        </button>

        <div class="instructions">
            <p class="font-semibold text-xl mb-3 text-yellow-400">Marcador Requerido:</p>
            <img class="mt-4 rounded-lg shadow-md max-w-full h-auto mx-auto border-2 border-white" style="max-height: 150px;" 
                 src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" 
                 alt="Imagen del marcador Card-Example" />
            <p class="mt-3 text-sm italic text-gray-400">Apunta la cámara a esta imagen.</p>
        </div>
    </div>
    
    <!-- 2. Contenedor de estado de detección (en la escena AR) -->
    <div id="detection-status"></div>

    <!-- 3. CONTENEDOR DE LA ESCENA AR (Incluirá el Canvas generado por MindAR) -->
    <div id="scene-container">
        <!-- Elemento de video explícito para control manual de la cámara -->
        <video id="video-element" autoplay playsinline></video>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const startOverlay = document.getElementById('start-overlay');
        const sceneContainer = document.getElementById('scene-container');
        const videoElement = document.getElementById('video-element');
        const statusDiv = document.getElementById('detection-status');

        let mindarThree;
        let renderer, scene, camera;
        let mesh; // Objeto 3D (el cubo)

        // Función para manejar errores de la API de MediaDevices
        const handleError = (error) => {
            console.error('Error al acceder a la cámara:', error);
            const message = error.name === 'NotAllowedError' ? 
                'Permiso de cámara denegado. Por favor, habilítalo en la configuración del navegador.' : 
                `Error: ${error.message}. Asegúrate de que tu dispositivo tiene cámara.`;
            
            document.getElementById('status-message').innerHTML = `
                <div class="bg-red-700 text-white p-4 rounded-lg shadow-xl text-center">
                    ⚠️ ${message}
                </div>
            `;
            startButton.style.display = 'none';
        };

        const setupThreeScene = (anchor) => {
            // Configurar la escena 3D (solo la parte que depende del marcador)
            
            // 1. Crear el cubo 3D (malla)
            const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
            const material = new THREE.MeshPhongMaterial({ color: 0x6366f1, transparent: true, opacity: 0.9 });
            mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.05, 0); // Un poco levantado sobre el marcador

            // 2. Crear el plano (piso/sombra)
            const planeGeometry = new THREE.PlaneGeometry(1, 0.65);
            const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2; // Rotar para que quede plano (horizontal)
            plane.position.y = 0;

            // 3. Añadir luz (necesaria para MeshPhongMaterial)
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            scene.add(light);

            // 4. Añadir los objetos al anclaje de MindAR
            anchor.group.add(mesh);
            anchor.group.add(plane);
        };

        const startAR = async () => {
            try {
                // 1. Ocultar la superposición de inicio
                startOverlay.style.opacity = '0';
                setTimeout(() => { startOverlay.style.display = 'none'; }, 500); 

                // 2. Iniciar la cámara manualmente
                statusDiv.textContent = 'Solicitando acceso a la cámara...';
                statusDiv.className = "bg-yellow-600/80";
                statusDiv.style.display = 'block';

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });

                videoElement.srcObject = stream;
                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = resolve;
                });
                // El video está cargado y listo para ser usado por MindAR

                // 3. Inicializar MindAR Three.js, pasándole el elemento de video
                mindarThree = new MindARThree.MindARThree({
                    container: sceneContainer,
                    imageTargetSrc: 'https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind',
                    video: videoElement, // CRÍTICO: Usar el video ya iniciado
                });

                // Obtener componentes de la escena
                renderer = mindarThree.renderer;
                scene = mindarThree.scene;
                camera = mindarThree.camera;

                // 4. Obtener el anclaje de detección (Target Index 0)
                const anchor = mindarThree.addAnchor(0);

                // 5. Configurar los objetos 3D y la luz en el anclaje
                setupThreeScene(anchor);
                
                // 6. Configurar eventos de detección
                anchor.onTargetFound = () => {
                    statusDiv.textContent = '¡Marcador detectado!';
                    statusDiv.className = "bg-green-600/80";
                };
                anchor.onTargetLost = () => {
                    statusDiv.textContent = 'Marcador perdido. Buscando...';
                    statusDiv.className = "bg-yellow-600/80";
                };

                // 7. Iniciar el motor AR
                await mindarThree.start();
                console.log("MindAR Three.js iniciado correctamente.");
                sceneContainer.style.display = 'block';
                statusDiv.textContent = 'Buscando marcador...';
                statusDiv.className = "bg-yellow-600/80";
                
                // 8. Iniciar el loop de animación
                animate();

            } catch (error) {
                handleError(error);
            }
        };

        // Bucle de animación de Three.js
        const animate = () => {
            // Animación del cubo: rotación
            if (mesh) {
                mesh.rotation.y += 0.02;
            }
            
            // Renderizado de la escena
            renderer.render(scene, camera);
            
            // El motor AR de MindAR actualiza la pose de la cámara automáticamente
            // Usamos requestAnimationFrame para el loop
            requestAnimationFrame(animate);
        }

        // Evento de inicio con el gesto del usuario
        startButton.addEventListener('click', startAR);

        // Inicializar estado del div de detección
        document.addEventListener('DOMContentLoaded', () => {
             statusDiv.textContent = "Listo para iniciar. Click en el botón.";
             statusDiv.className = "bg-gray-600/80";
        });
    </script>
</body>
</html>
