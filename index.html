<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR MindAR A-Frame</title>
    <!-- Librerías base -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        
        /* Capa de carga inicial */
        #ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: linear-gradient(to bottom, #111827, #000);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        /* Ocultar botones de A-Frame que ensucian la pantalla */
        .a-enter-vr { display: none !important; }
        
        /* Mensaje de error personalizado si la cámara falla */
        #error-msg {
            display: none;
            background: #ef4444;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Interfaz de usuario previa al inicio -->
    <div id="ui-overlay">
        <h1 class="text-3xl font-bold mb-6 text-teal-400">Explorador AR</h1>
        
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 mb-8 text-center max-w-sm">
            <p class="text-gray-300 mb-4">Escanea el código o la tarjeta para ver el modelo 3D en realidad aumentada.</p>
            <img src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" 
                 class="w-48 h-auto mx-auto border-4 border-white rounded shadow-lg" alt="Marcador">
            <p class="text-xs text-gray-500 mt-2">Marcador de ejemplo</p>
        </div>

        <button id="btn-start" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-4 px-10 rounded-full text-lg shadow-xl transform transition hover:scale-105 active:scale-95">
            INICIAR EXPERIENCIA
        </button>

        <div id="error-msg">Ocurrió un error inesperado al iniciar el AR.</div>
    </div>

    <!-- Escena AR: Se mantiene en el DOM pero MindAR no arranca hasta que lo llamemos -->
    <a-scene 
        id="main-scene"
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- El astronauta del ejemplo -->
            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Objetivo del marcador -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Modelo 3D del astronauta -->
            <a-gltf-model 
                src="#avatarModel" 
                rotation="0 0 0" 
                position="0 0 0.1" 
                scale="0.005 0.005 0.005"
                animation="property: position; to: 0 0.1 0.1; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const btnStart = document.getElementById('btn-start');
        const overlay = document.getElementById('ui-overlay');
        const errorMsg = document.getElementById('error-msg');
        const scene = document.querySelector('a-scene');

        btnStart.addEventListener('click', () => {
            // Intentar arrancar el sistema AR
            try {
                // 1. Ocultar interfaz inicial
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 500);

                // 2. Acceder al componente MindAR de la escena y llamar a start
                // Usamos un pequeño timeout para asegurar que el DOM esté listo tras la interacción
                setTimeout(() => {
                    const mindarSystem = scene.systems['mindar-image-system'];
                    if (mindarSystem) {
                        mindarSystem.start(); 
                    } else {
                        // Fallback por si el sistema se registra diferente en esta versión
                        scene.components['mindar-image'].start();
                    }
                }, 100);

            } catch (e) {
                console.error("Error al iniciar AR:", e);
                overlay.style.opacity = '1';
                overlay.style.display = 'flex';
                errorMsg.style.display = 'block';
                btnStart.innerText = "Reintentar";
            }
        });

        // Manejador de errores global para eventos de la cámara de MindAR
        scene.addEventListener('arError', (event) => {
            console.log("Evento de error AR detectado");
            overlay.style.opacity = '1';
            overlay.style.display = 'flex';
            errorMsg.style.display = 'block';
            errorMsg.innerText = "Error: No se pudo acceder a la cámara.";
        });
    </script>
</body>
</html>
