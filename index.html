<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escaner AR con A-Frame (Estable)</title>
    
    <!-- Tailwind CSS CDN para el estilo de la interfaz -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- 1. Librerías CRÍTICAS: A-Frame y MindAR A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #000;
        }

        /* Oculta la escena A-Frame hasta que el usuario haga click */
        #ar-scene {
            display: none;
            width: 100%;
            height: 100%;
        }

        /* Estilos de la capa de inicio */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background-color: rgba(17, 24, 39, 0.98); 
            padding: 1rem;
            transition: opacity 0.5s ease-out;
        }

        .instructions {
            background-color: #1f2937;
            color: #d1d5db;
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-top: 2rem;
            border: 1px solid #374151;
            max-width: 90%;
            text-align: center;
        }
        
    </style>
</head>
<body>

    <!-- 1. CAPA DE INICIO (Requiere gesto de usuario) -->
    <div id="start-overlay">
        <h1 class="text-4xl font-extrabold text-indigo-400 mb-4 text-center">AR con MindAR y A-Frame</h1>
        
        <p class="text-lg text-gray-300 mb-8 text-center max-w-lg">
            Presiona el botón para iniciar la experiencia AR y activar la cámara.
        </p>

        <button id="startButton" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 px-12 text-xl rounded-full shadow-2xl transition duration-300 transform hover:scale-105 cursor-pointer ring-4 ring-teal-400">
            Iniciar Cámara AR
        </button>

        <div class="instructions">
            <p class="font-semibold text-xl mb-3 text-yellow-400">Marcador de Ejemplo (Apúntale):</p>
            <img class="mt-4 rounded-lg shadow-md max-w-full h-auto mx-auto border-2 border-white" style="max-height: 150px;" 
                 src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" 
                 alt="Imagen del marcador Card-Example" />
            <p class="mt-3 text-sm italic text-gray-400">Este marcador debe aparecer en la cámara.</p>
        </div>
    </div>
    
    <!-- 2. ESCENA A-FRAME (Inicialmente oculta) -->
    <a-scene 
        id="ar-scene"
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
        renderer="colorManagement: true, physicallyCorrectLights: true"
        color-space="sRGB"
        mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: false; filterBeta: 0.00001;"
    >
        <!-- Assets (Imágenes, modelos 3D, etc.) -->
        <a-assets>
            <!-- Modelo GLTF del ejemplo -->
            <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- Cámara de A-Frame configurada para AR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Contenido AR anclado al marcador 0 -->
        <a-entity mindar-image-target="targetIndex: 0">
            <!-- Modelo 3D (Escala ajustada para ser visible) -->
            <a-gltf-model 
                rotation="0 0 0" 
                position="0 0 0.15" 
                scale="0.005 0.005 0.005" 
                src="#avatarModel"
                animation="property: position; to: 0 0.1 0.15; dur: 1500; easing: easeInOutQuad; loop: true; dir: alternate"
            ></a-gltf-model>
            
            <!-- Texto flotante simple -->
            <a-text 
                value="¡Detección Exitosa!" 
                color="#00ffaa" 
                width="1.5" 
                align="center"
                position="0 0.3 0" 
                rotation="0 0 0"
            ></a-text>
        </a-entity>
    </a-scene>

    <script>
        const startButton = document.getElementById('startButton');
        const startOverlay = document.getElementById('start-overlay');
        const arScene = document.getElementById('ar-scene');
        
        // Función para iniciar la escena AR después del clic del usuario
        const initAR = () => {
            // 1. Ocultar la capa de inicio
            startOverlay.style.opacity = '0';
            setTimeout(() => { startOverlay.style.display = 'none'; }, 500);

            // 2. Mostrar la escena AR
            arScene.style.display = 'block';

            // 3. Iniciar MindAR. La configuración 'autoStart: false' se deshabilita
            // y se llama al método start() de la escena para comenzar la sesión AR.
            // Esto es CRÍTICO para asegurar que el gesto de usuario active la cámara.
            arScene.addEventListener('loaded', () => {
                // Si la escena ya está cargada, simplemente la iniciamos
                const mindarComponent = arScene.components['mindar-image'];
                if (mindarComponent) {
                    mindarComponent.start();
                } else {
                     console.error("Componente mindar-image no encontrado.");
                }
            });

            // Si la escena aún no está cargada (raro), A-Frame la cargará y luego la iniciará.
            // Si ya está cargada, A-Frame solo necesita la llamada a start()
            if (arScene.is('loaded')) {
                const mindarComponent = arScene.components['mindar-image'];
                if (mindarComponent) {
                    mindarComponent.start();
                }
            }
        };

        // Evento de inicio con el gesto del usuario
        startButton.addEventListener('click', initAR);
    </script>
</body>
</html>
